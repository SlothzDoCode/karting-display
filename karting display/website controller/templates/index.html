<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="../static/css/index.css">
        <meta charset="UTF-8">
        <title>My Web Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="../static/js/index.js" defer></script>
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>

    <body>
        <div class="container" id="container">
            <div class="form-container sign-up-container">
                <div class="container">

                    <div class="sidebar">
                        <h3>Options</h3>
                        <div class="sidebar-options">
                            <button id="profile">Profile</button>
                            <button id="home">Home</button>
                            <button id="tracks">Tracks</button>
                            <button id="bug-report">Report Bug</button>

                            <div class="spacer"></div>

                            <button id="logout">Logout</button>
                        </div>
                    </div>

                    <div class="control-panel">
                        <div class="cp-left">
                            <button class="green" id="Green-Flag">Green Flag</button>
                            <button class="yellow" id="Yellow-Flag">Yellow Flag</button>
                            <button class="red" id="Red-Flag">Red Flag</button>
                            <button class="blue" id="Blue-Flag">Blue Flag</button>
                        </div>   
                        <div class="cp-right"> 
                            <select title="timer" name="Time" id="time">
                                <option value ="" disabled selected hidden>Select length of session</option>
                                <option value="5">5 minutes</option>
                                <option value="10">10 minutes</option>
                                <option value="15">15 minutes</option>
                                <option value="20">20 minutes</option>
                                <option value="25">25 minutes</option>
                                <option value="30">30 minutes</option>
                                <option value="35">35 minutes</option>
                                <option value="40">40 minutes</option>
                            </select>

                            <select title="positions" name="Position" id="position">
                                <option value="" disabled selected hidden>Select current position</option>
                                <option value="1">1st</option>
                                <option value="2">2nd</option>
                                <option value="3">3rd</option>
                                <option value="4">4th</option>
                                <option value="5">5th</option>
                                <option value="6">6th</option>
                                <option value="7">7th</option>
                                <option value="8">8th</option>
                                <option value="9">9th</option>
                                <option value="10">10th</option>
                                <option value="11">11th</option>
                                <option value="12">12th</option>
                                <option value="13">13th</option>
                                <option value="14">14th</option>
                                <option value="15">15th</option>
                                <option value="16">16th</option>
                                <option value="17">17th</option>
                                <option value="18">18th</option>
                                <option value="19">19th</option>
                                <option value="20">20th</option>
                            </select>

                            <button class="PB" id="PB">Driver PB</button>
                            <button class="Pitstop" id="Pitstop">Pitstop</button>
                        </div>
                    </div>

                    <div class="graph-options">
                        <h2>Graph Options</h2>
                    </div>

                    <div class="tracking-map">
                        <select title="Location" name="Location" id="location">
                            <option value="placehold" disabled selected hidden>Track</option>
                        </select>
                        <div class="map"></div>
                    </div>

                    <div class="timing-table">
                        <div class="table-container">
                            <table>
                            <tr>
                                <th>Lap Number</th>
                                <th>Lap Time</th>
                                <th>Relative</th>
                            </tr>
                            <tr>
                                <td>1</td>
                                <td>1:34.669</td>
                                <td>+0:00.000</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>1:35.329</td>
                                <td>+0:00.660</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>1:34.782</td>
                                <td>-0:00.547</td>
                            </tr>

                        </table>
                        </div>
                        <p>This is just an example of data that could be shown here, this feature does not work yet</p>
                    </div>

                </div>

            </div>
        </div>

        <!-- Bug Report Modal -->
        <div id="bug-modal" class="modal">
        <div class="modal-content">
            <span id="close-bug-modal" class="close">&times;</span>
            <h3>Report a Bug</h3>
            <input type="text" id="bug-title" placeholder="Bug Title" />
            <textarea id="bug-description" placeholder="Describe the bug"></textarea>
            <button id="submit-bug">Submit Bug</button>
            <p id="bug-status"></p>
        </div>
        </div>
    </body>
</html>
