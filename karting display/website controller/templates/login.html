<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="../static/css/login.css">
        <meta charset="UTF-8">
        <title>My Web Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="../static/js/login.js" defer></script>
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>

    <body>
        <h2>Login</h2>
        <div class="container" id="container">
            <div class="form-container sign-up-container">
                <form action="#">
                    <h1></h1>
                    <input type="text" placeholder="Full Name" id="name" disabled/>
                    <input type="text" placeholder="Email" id="email" disabled/>
                    <input type="password" placeholder="Password" id="pass" disabled/>
                    <input type="password" placeholder="Confirm Password" id="confpass" disabled/>
                    <button type="button" id="get-signUp" disabled>Sign Up</button>
                    <p>This feature is currently disabled</p>
                </form>
            </div>
            <div class="form-container sign-in-container">
                <form action="#">
                    <h1></h1>
                    <input type="text" placeholder="Username" id="uname" />
                    <input type="password" placeholder="Password" id="password" />
                    <button type="button" id="forgot_pass">Forgot your password?</button>
                    <button type="button" id="get-logIn">Log In</button>
                </form>
            </div>
            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1></h1>
                        <p></p>
                        <button class="ghost" id="signIn">Log In</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1></h1>
                        <p></p>
                        <button class="ghost" id="signUp">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
